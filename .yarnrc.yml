# Use the classic node_modules layout instead of Yarn PnP.
# Next.js + Turbopack resolves packages by walking node_modules on disk, which
# Yarn PnP does not provide — under PnP, Turbopack fails with
# "couldn't find the Next.js package (next/package.json)". node-modules keeps
# Yarn + yarn.lock while producing a layout Turbopack understands.
nodeLinker: node-modules
